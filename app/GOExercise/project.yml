name: GOExercise
options:
  bundleIdPrefix: com.goexercise
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "29YX3L7B47"
    CODE_SIGN_STYLE: Automatic
    # リリースのバージョン/ビルド番号を一元管理 (app+widget が継承)。
    # TestFlight 再アップロードのたびに CURRENT_PROJECT_VERSION を +1 する。
    # 1.0(1)却下 / 1.0(2) / 1.0(3)=承認済み(友達+UUID修正)。
    # 1.1 = v1.2機能群(達成装飾A〜F/紹介スター/設定リデザイン/polish)の初の機能更新。build は通し番号で 4。
    # 1.2 = friends-polish群(アカウント堅牢化/anti-resurrection/クラウドバックアップ/友達公園/猫アート是正/コントラスト)。build 通し番号 6。
    # build 7 = アカウント管理を整理: サインアウト廃止(友達は常時オンの標準機能・認証は backup/restore
    #   専用で非干渉。匿名サインアウト=全データ消去の footgun を除去)。アカウント削除を友達タブ→
    #   設定「アカウントとバックアップ」へ移設(審査5.1.1(v)導線は維持)。
    # build 8 = 受信応援トーストの可視性強化(タブバー被り対策で bottom padding 24→64・
    #   表示3秒→5秒)。実機で配信は成功(友達化+応援201)もトーストが下端で見落とされた対策。
    # build 9 = 受信応援トースト不発の根因修正(unseenReceivedCheers が protocol 要件でなく
    #   静的ディスパッチで extension 既定[]を呼んでいた)。build 8 は同機能が壊れたまま=提出不可。
    # 1.2(10) = build 9 と同一バイナリを Organizer 再アップ(Xcode 自動繰上げ)。これを審査提出→公開済み。
    # 1.3 = 共有カード刷新(白余白解消/スマホ全画面比/英字バッジ重複解消)+履歴ハイライト名称
    #   (Weekly/Monthly/All-time)+今月化+友達「今週の達成」をホームと状態別連動(weekly_statuses)。
    # build 11 = 上記までを Upload 済み(ただしバックアップ表示バグ修正は未含)。
    # build 12 = バックアップ中プロバイダ表示が並び順依存で誤表示するバグ修正(c6893b8)を含めた版。
    #   build 11 は ASC にアップ済みのため番号を 12 に上げて差し替える(同番号は ASC が拒否)。
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "12"
packages:
  # プライバシー配慮型の行動分析 SDK。App ID (Info.plist の TelemetryDeckAppID)
  # を設定するまでは送信されない (Analytics.configureIfPossible 参照)。
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: "2.9.0"
  # 友達機能のプラットフォーム中立バックエンド (Apple↔Android 共有対応)。
  # 匿名認証 + PostgREST。設定は Secrets.xcconfig (SUPABASE_HOST / SUPABASE_ANON_KEY)。
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  GOExercise:
    type: application
    platform: iOS
    sources:
      - path: GOExercise
        # Products.storekit も除外: sources のパス走査が .storekit を自動で resource 分類して
        # IPA に同梱してしまうため(GPT-5.5/Claude 監査)。Debug の StoreKit テストは scheme の
        # run.storeKitConfiguration 参照だけで効く。Info.plist は info: で別管理。
        excludes: ["Resources/Info.plist", "Resources/Products.storekit"]
      # ウィジェット view を golden 撮影テスト(WidgetRenderSnapshotTest)から ImageRenderer で
      # 実描画するため app target にも含める(WidgetSnapshot と同一モジュール→ @testable で到達)。
      # widget 拡張ターゲットにも従来どおり含まれる(別モジュールなので衝突しない)。
      - path: GOExerciseWidget/Views/SmallWidgetView.swift
      - path: GOExerciseWidget/Views/WidgetCatView.swift
      - path: GOExerciseWidget/Views/RecordPromptChipView.swift
    resources:
      - path: GOExercise/Resources/Assets.xcassets
      # Products.storekit は **resources に含めない**(本番IPAに内部メタデータを同梱しない。
      # GPT-5.5/Claude 監査)。Debug 実行時の StoreKit テストは下の scheme の
      # run.storeKitConfiguration 参照だけで効く(Release/Archive は実 App Store に接続)。
    info:
      path: GOExercise/Resources/Info.plist
      properties:
        CFBundleDisplayName: GO エクササイズ
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # 画面の向き。iPhone は縦のみ。iPad は universal アプリの
        # マルチタスク要件 (App Store 検証 code 90474) を満たすため 4 方向すべて。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: 達成記念カードや連続記録カードを写真ライブラリに保存するために使用します。
        NSCameraUsageDescription: 友達のQRコードを読み取って友達追加するために使用します。
        NSSupportsLiveActivities: true
        # 輸出コンプライアンス: 本アプリは標準の HTTPS(TLS)のみで独自/非標準の暗号は使わない
        # = 適用除外。false を宣言して TestFlight/提出ごとの暗号コンプラ質問を省く
        # (project.yml で宣言し xcodegen 再生成でも落ちないようにする)。
        ITSAppUsesNonExemptEncryption: false
        # TelemetryDeck の App ID。値は Secrets.xcconfig の TELEMETRYDECK_APP_ID 由来
        # (gitignore)。空の間は計測を送信しない (ゼロ収集を維持)。
        # ※ ここで project.yml に宣言しておくことで `xcodegen generate` が Info.plist を
        #   再生成しても本キーが落ちない (再発バグ対策。FriendsAppleLinkEnabled も同様)。
        TelemetryDeckAppID: "$(TELEMETRYDECK_APP_ID)"
        # 友達のアカウント連携 (Apple サインインでの機種変復旧) を有効にするか。
        # これが無いと SupabaseConfig.appleLinkEnabled=false → Apple バックアップ/復元UIが
        # 非表示。手動キーだと xcodegen 再生成で落ちるため project.yml で恒久宣言する。
        FriendsAppleLinkEnabled: true
        # Google サインイン (web/PKCE) でのバックアップ/復元を有効にするか。Apple と対称に表示。
        # Supabase の Google provider 有効化 + redirect 許可リスト (goexercise://auth-callback) が前提。
        FriendsGoogleLinkEnabled: true
        # 友達バックエンド (Supabase)。値は Secrets.xcconfig 由来 (gitignore)。
        # 空の間は friends が Mock にフォールバック (Supabase 未接続)。
        SupabaseHost: "$(SUPABASE_HOST)"
        SupabaseAnonKey: "$(SUPABASE_ANON_KEY)"
        # CAPTCHA (Cloudflare Turnstile)。空の間は CAPTCHA 無効 (匿名サインインは
        # captchaToken なし = 従来挙動)。値を入れると Turnstile チャレンジを実行。
        TurnstileSiteKey: "$(TURNSTILE_SITE_KEY)"
        CFBundleURLTypes:
          - CFBundleURLName: com.goexercise.app
            CFBundleURLSchemes:
              - goexercise
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goexercise.app
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: GOExercise/Resources/GOExercise.entitlements
    dependencies:
      - target: GOExerciseWidget
        embed: true
      - package: TelemetryDeck
      - package: Supabase
  GOExerciseWidget:
    type: app-extension
    platform: iOS
    sources:
      # WidgetCatAssets.xcassets (ブランドのオレンジ猫 7 状態の縮小版) はこの
      # source パス走査で xcodegen が自動的に resource として分類・同梱する。
      # 本体 Assets.xcassets は 88MB あり widget には丸ごと入れられないため分離。
      - path: GOExerciseWidget
        excludes: ["Info.plist"]
      - path: GOExercise/Models/CatState.swift
      - path: GOExercise/Models/CatBreed.swift
      - path: GOExercise/Models/WidgetSnapshot.swift
      - path: GOExercise/Models/WorkoutRecord.swift
      - path: GOExercise/Models/ExerciseItem.swift
      - path: GOExercise/Models/WorkoutCategory.swift
      # WeightEntry / MenstrualEntry はウィジェットが App Group 共有ストアを
      # メインアプリと同一 schema で開くために必要 (監査 B-Critical-1)。
      - path: GOExercise/Models/WeightEntry.swift
      - path: GOExercise/Models/MenstrualEntry.swift
      - path: GOExercise/Services/AppModelContainer.swift
      - path: GOExercise/Services/SharedSnapshotStore.swift
      - path: GOExercise/Services/WidgetTimelineDates.swift
      - path: GOExercise/Services/DateProvider.swift
      - path: GOExercise/Services/CatActivityAttributes.swift
    info:
      path: GOExerciseWidget/Info.plist
      properties:
        CFBundleDisplayName: GO エクササイズWidget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goexercise.app.widget
        CODE_SIGN_ENTITLEMENTS: GOExerciseWidget/GOExerciseWidget.entitlements
  GOExerciseTests:
    type: bundle.unit-test
    platform: iOS
    sources: GOExerciseTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GOExercise
  GOExerciseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: GOExerciseUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GOExercise
schemes:
  GOExercise:
    build:
      targets:
        GOExercise: all
        GOExerciseWidget: all
    run:
      # StoreKit Configuration File: simulator 内で App Store Connect なしに
      # IAP / Subscription の動作テスト ができる。本番ビルドでは無視される。
      storeKitConfiguration: GOExercise/Resources/Products.storekit
      # 友達 CloudKit 疎通テスト用の起動引数 (DEBUG限定で解釈)。
      # 既定は無効 = 普段の Debug 実行は従来どおり (friendsEnabled=false / MockFriendsService)。
      # runbook I の疎通テスト時に Edit Scheme でチェックを入れて有効化する:
      #   --enable-friends   → AppFeatureFlags.friendsEnabled を true (友達タブ表示)
      #   --cloudkit-friends → MockFriendsService から実 CloudKitFriendsService へ切替
      commandLineArguments:
        "--enable-friends": false
        "--cloudkit-friends": false
    test:
      targets:
        - GOExerciseTests
        - GOExerciseUITests
