name: GOExercise
options:
  bundleIdPrefix: com.goexercise
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  # プライバシー配慮型の行動分析 SDK。App ID (Info.plist の TelemetryDeckAppID)
  # を設定するまでは送信されない (Analytics.configureIfPossible 参照)。
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: "2.9.0"
targets:
  GOExercise:
    type: application
    platform: iOS
    sources:
      - path: GOExercise
        excludes: ["Resources/Info.plist"]
    resources:
      - path: GOExercise/Resources/Assets.xcassets
      - path: GOExercise/Resources/Products.storekit
    info:
      path: GOExercise/Resources/Info.plist
      properties:
        CFBundleDisplayName: GO エクササイズ
        UILaunchScreen: {}
        NSPhotoLibraryAddUsageDescription: 達成記念カードや連続記録カードを写真ライブラリに保存するために使用します。
        NSSupportsLiveActivities: true
        # TelemetryDeck の App ID。空の間は計測を送信しない (ゼロ収集を維持)。
        # ダッシュボードで取得した UUID をリリース前に設定する。
        TelemetryDeckAppID: ""
        CFBundleURLTypes:
          - CFBundleURLName: com.goexercise.app
            CFBundleURLSchemes:
              - goexercise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goexercise.app
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: GOExercise/Resources/GOExercise.entitlements
    dependencies:
      - target: GOExerciseWidget
        embed: true
      - package: TelemetryDeck
  GOExerciseWidget:
    type: app-extension
    platform: iOS
    sources:
      # WidgetCatAssets.xcassets (ブランドのオレンジ猫 7 状態の縮小版) はこの
      # source パス走査で xcodegen が自動的に resource として分類・同梱する。
      # 本体 Assets.xcassets は 88MB あり widget には丸ごと入れられないため分離。
      - path: GOExerciseWidget
        excludes: ["Info.plist"]
      - path: GOExercise/Models/CatState.swift
      - path: GOExercise/Models/CatBreed.swift
      - path: GOExercise/Models/WidgetSnapshot.swift
      - path: GOExercise/Models/WorkoutRecord.swift
      - path: GOExercise/Models/ExerciseItem.swift
      - path: GOExercise/Models/WorkoutCategory.swift
      # WeightEntry / MenstrualEntry は QuickRecordIntent が App Group 共有ストアを
      # メインアプリと同一 schema で開くために必要 (監査 B-Critical-1)。
      - path: GOExercise/Models/WeightEntry.swift
      - path: GOExercise/Models/MenstrualEntry.swift
      - path: GOExercise/Services/AppModelContainer.swift
      - path: GOExercise/Services/SharedSnapshotStore.swift
      - path: GOExercise/Services/WidgetTimelineDates.swift
      - path: GOExercise/Services/DateProvider.swift
      - path: GOExercise/Services/CatActivityAttributes.swift
    info:
      path: GOExerciseWidget/Info.plist
      properties:
        CFBundleDisplayName: GO エクササイズWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goexercise.app.widget
        CODE_SIGN_ENTITLEMENTS: GOExerciseWidget/GOExerciseWidget.entitlements
  GOExerciseTests:
    type: bundle.unit-test
    platform: iOS
    sources: GOExerciseTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GOExercise
  GOExerciseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: GOExerciseUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GOExercise
schemes:
  GOExercise:
    build:
      targets:
        GOExercise: all
        GOExerciseWidget: all
    run:
      # StoreKit Configuration File: simulator 内で App Store Connect なしに
      # IAP / Subscription の動作テスト ができる。本番ビルドでは無視される。
      storeKitConfiguration: GOExercise/Resources/Products.storekit
    test:
      targets:
        - GOExerciseTests
        - GOExerciseUITests
