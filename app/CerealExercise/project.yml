name: CerealExercise
options:
  bundleIdPrefix: com.serial
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  CerealExercise:
    type: application
    platform: iOS
    sources:
      - path: CerealExercise
        excludes: ["Resources/Info.plist"]
    resources:
      - path: CerealExercise/Resources/Assets.xcassets
    info:
      path: CerealExercise/Resources/Info.plist
      properties:
        CFBundleDisplayName: GOエクササイズ
        UILaunchScreen: {}
        NSPhotoLibraryAddUsageDescription: 達成記念カードや連続記録カードを写真ライブラリに保存するために使用します。
        CFBundleURLTypes:
          - CFBundleURLName: com.serial.cerealexercise
            CFBundleURLSchemes:
              - cerealexercise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serial.cerealexercise
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: CerealExercise/Resources/CerealExercise.entitlements
    dependencies:
      - target: CerealExerciseWidget
        embed: true
  CerealExerciseWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CerealExerciseWidget
        excludes: ["Info.plist"]
      - path: CerealExercise/Models/CatState.swift
      - path: CerealExercise/Models/WidgetSnapshot.swift
      - path: CerealExercise/Services/SharedSnapshotStore.swift
      - path: CerealExercise/Services/WidgetTimelineDates.swift
    info:
      path: CerealExerciseWidget/Info.plist
      properties:
        CFBundleDisplayName: GOエクササイズWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serial.cerealexercise.widget
        CODE_SIGN_ENTITLEMENTS: CerealExerciseWidget/CerealExerciseWidget.entitlements
  CerealExerciseTests:
    type: bundle.unit-test
    platform: iOS
    sources: CerealExerciseTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CerealExercise
  CerealExerciseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: CerealExerciseUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CerealExercise
