name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app/CerealExercise
        run: xcodegen generate

      - name: List available iOS Simulators
        run: xcrun simctl list devices available | grep -E "iPhone" | head -20

      - name: Build
        working-directory: app/CerealExercise
        run: |
          set -euo pipefail
          DEST_NAME=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable) | select(.name | startswith("iPhone"))] | .[0].name')
          if [ -z "$DEST_NAME" ] || [ "$DEST_NAME" = "null" ]; then
            echo "No iPhone simulator available"
            exit 1
          fi
          echo "Destination: $DEST_NAME"
          xcodebuild \
            -project CerealExercise.xcodeproj \
            -scheme CerealExercise \
            -destination "platform=iOS Simulator,name=$DEST_NAME" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Test
        working-directory: app/CerealExercise
        run: |
          set -euo pipefail
          DEST_NAME=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable) | select(.name | startswith("iPhone"))] | .[0].name')
          xcodebuild \
            -project CerealExercise.xcodeproj \
            -scheme CerealExercise \
            -destination "platform=iOS Simulator,name=$DEST_NAME" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            test

      - name: Upload Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
