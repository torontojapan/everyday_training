name: Android Parity Guard

# Android↔iOS build 12 のパリティ恒久ゲート。
#  1) parity-guard: 生 fontSize / ハードコード色 / FontWeight.Black の新規混入を fail(ドリフト源の予防)。
#  2) token-parity: AppType トークンが iOS build 12 の値と一致するか(AppTypeParityTest)+ 既存 unit。
# 方針 = docs/PARITY_100_PLAN.md。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  parity-guard:
    name: Drift-source guard (raw font/color)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run parity guard (fails on NEW raw fontSize / Color(0x) / FontWeight.Black)
        run: python3 tools/parity/parity_guard.py --strict

  token-parity:
    name: AppType tokens == iOS build 12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run AppType parity + unit tests
        working-directory: app-android
        run: ./gradlew :app:testDebugUnitTest --tests "com.goexercise.app.ui.theme.AppTypeParityTest" :app:testDebugUnitTest
